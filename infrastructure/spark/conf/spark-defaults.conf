# Cac gia tri minioadmin/minioadmin phai khop voi MINIO_ROOT_USER / MINIO_ROOT_PASSWORD trong .env
# Can mang internet trong container de Spark tu tai cac package ben duoi qua Maven

spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lakehouse=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.catalog-impl=org.apache.iceberg.rest.RESTCatalog
spark.sql.catalog.lakehouse.uri=http://iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse=s3://warehouse/
spark.sql.catalog.lakehouse.io-impl=org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint=http://minio:9000
spark.sql.catalog.lakehouse.s3.path-style-access=true
spark.sql.catalog.lakehouse.s3.region=us-east-1
spark.sql.catalog.lakehouse.client.region=us-east-1
spark.sql.catalog.lakehouse.s3.access-key-id=minioadmin
spark.sql.catalog.lakehouse.s3.secret-access-key=aA@123456

spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=minioadmin
spark.hadoop.fs.s3a.secret.key=aA@123456
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.endpoint.region=us-east-1

spark.driver.extraJavaOptions=-Daws.region=us-east-1
spark.executor.extraJavaOptions=-Daws.region=us-east-1

spark.pyspark.python=/usr/local/bin/python3.12
spark.pyspark.driver.python=/usr/local/bin/python3.12
spark.executorEnv.PYSPARK_PYTHON=/usr/local/bin/python3.12

spark.jars.packages=org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.iceberg:iceberg-aws-bundle:1.6.1,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.620,com.oracle.database.jdbc:ojdbc11:23.4.0.24.05
spark.jars.ivy=/tmp/.ivy2
