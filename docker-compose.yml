networks:
  lakehouse_net:
    driver: bridge

volumes:
  oracle_data:
  minio_data:
  postgres_data:
  superset_home:

services:
  # ======================================================================
  # Oracle Database XE — nguồn dữ liệu OLTP mẫu cho pipeline ingest
  # ======================================================================
  oracle-db:
    image: ${ORACLE_IMAGE}
    container_name: oracle-db
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${ORACLE_APP_USER}
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD}
    ports:
      - "${ORACLE_PORT}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./infrastructure/oracle/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - lakehouse_net

  # ======================================================================
  # MinIO — S3-compatible object storage cho Iceberg warehouse
  # ======================================================================
  # Image Bitnami: bundle san ca mc client, tu tao bucket qua MINIO_DEFAULT_BUCKETS
  minio:
    image: ${MINIO_IMAGE}
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET}
      MINIO_BROWSER: "on"
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - lakehouse_net

  # ======================================================================
  # PostgreSQL — metadata DB dùng chung cho Airflow, Superset, Iceberg catalog
  # ======================================================================
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      SUPERSET_DB: ${SUPERSET_DB}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      ICEBERG_CATALOG_DB: ${ICEBERG_CATALOG_DB}
      ICEBERG_CATALOG_DB_USER: ${ICEBERG_CATALOG_DB_USER}
      ICEBERG_CATALOG_DB_PASSWORD: ${ICEBERG_CATALOG_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - lakehouse_net

  # ======================================================================
  # Iceberg REST Catalog — catalog service cho Spark & Trino
  # ======================================================================
  iceberg-rest:
    image: ${ICEBERG_REST_IMAGE}
    container_name: iceberg-rest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/${ICEBERG_CATALOG_DB}
      CATALOG_JDBC_USER: ${ICEBERG_CATALOG_DB_USER}
      CATALOG_JDBC_PASSWORD: ${ICEBERG_CATALOG_DB_PASSWORD}
      CATALOG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    ports:
      - "${ICEBERG_REST_PORT}:8181"
    networks:
      - lakehouse_net

  # ======================================================================
  # Apache Spark — Master & Worker, đọc/viết Iceberg table qua REST catalog
  # ======================================================================
  spark-master:
    build:
      context: ./infrastructure/spark
      args:
        SPARK_IMAGE: ${SPARK_IMAGE}
    image: lakehouse-spark:3.5.5
    container_name: spark-master
    restart: unless-stopped
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "${SPARK_MASTER_PORT}:7077"
      - "${SPARK_MASTER_UI_PORT}:8080"
    volumes:
      - ./infrastructure/spark/conf:/opt/spark/conf
    networks:
      - lakehouse_net

  spark-worker:
    build:
      context: ./infrastructure/spark
      args:
        SPARK_IMAGE: ${SPARK_IMAGE}
    image: lakehouse-spark:3.5.5
    container_name: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "${SPARK_WORKER_CORES}"
      - --memory
      - "${SPARK_WORKER_MEMORY}"
      - --webui-port
      - "8081"
      - spark://spark-master:7077
    ports:
      - "${SPARK_WORKER_UI_PORT}:8081"
    volumes:
      - ./infrastructure/spark/conf:/opt/spark/conf
    networks:
      - lakehouse_net

  # ======================================================================
  # Trino — query engine, federation Iceberg / Postgres / Oracle
  # ======================================================================
  trino:
    image: ${TRINO_IMAGE}
    container_name: trino
    restart: unless-stopped
    depends_on:
      iceberg-rest:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "${TRINO_PORT}:8080"
    volumes:
      - ./infrastructure/trino/etc:/etc/trino
    networks:
      - lakehouse_net

  # ======================================================================
  # Apache Airflow — init (migrate DB + tạo admin), webserver, scheduler
  # ======================================================================
  airflow-init:
    build:
      context: ./infrastructure/airflow
      args:
        AIRFLOW_IMAGE: ${AIRFLOW_IMAGE}
    image: lakehouse-airflow:2.9.3
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: python3 /opt/airflow/config/render_db_conn.py
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      AIRFLOW_DB: ${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: "Asia/Ho_Chi_Minh"
      AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    user: "${AIRFLOW_UID}:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true
    volumes:
      - ./tests/dags:/opt/airflow/dags
      - ./infrastructure/airflow/logs:/opt/airflow/logs
      - ./infrastructure/airflow/plugins:/opt/airflow/plugins
      - ./infrastructure/airflow/config:/opt/airflow/config
      - ./tests/jobs:/opt/airflow/jobs
    networks:
      - lakehouse_net

  airflow-webserver:
    build:
      context: ./infrastructure/airflow
      args:
        AIRFLOW_IMAGE: ${AIRFLOW_IMAGE}
    image: lakehouse-airflow:2.9.3
    container_name: airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    user: "${AIRFLOW_UID}:0"
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    volumes:
      - ./tests/dags:/opt/airflow/dags
      - ./infrastructure/airflow/logs:/opt/airflow/logs
      - ./infrastructure/airflow/plugins:/opt/airflow/plugins
      - ./infrastructure/airflow/config:/opt/airflow/config
      - ./tests/jobs:/opt/airflow/jobs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - lakehouse_net

  airflow-scheduler:
    build:
      context: ./infrastructure/airflow
      args:
        AIRFLOW_IMAGE: ${AIRFLOW_IMAGE}
    image: lakehouse-airflow:2.9.3
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    user: "${AIRFLOW_UID}:0"
    command: scheduler
    volumes:
      - ./tests/dags:/opt/airflow/dags
      - ./infrastructure/airflow/logs:/opt/airflow/logs
      - ./infrastructure/airflow/plugins:/opt/airflow/plugins
      - ./infrastructure/airflow/config:/opt/airflow/config
      - ./tests/jobs:/opt/airflow/jobs
    networks:
      - lakehouse_net

  # ======================================================================
  # Apache Superset — BI / dashboard trên dữ liệu lakehouse (qua Trino)
  # ======================================================================
  superset-init:
    build:
      context: ./infrastructure/superset
      args:
        SUPERSET_IMAGE: ${SUPERSET_IMAGE}
    image: lakehouse-superset:3.1.0
    container_name: superset-init
    depends_on:
      postgres:
        condition: service_healthy
    environment: &superset-common-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      DATABASE_DIALECT: postgresql
      DATABASE_USER: ${SUPERSET_DB_USER}
      DATABASE_PASSWORD: ${SUPERSET_DB_PASSWORD}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_DB: ${SUPERSET_DB}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        superset db upgrade
        superset fab create-admin \
          --username "${SUPERSET_ADMIN_USER}" \
          --password "${SUPERSET_ADMIN_PASSWORD}" \
          --firstname "${SUPERSET_ADMIN_FIRSTNAME}" \
          --lastname "${SUPERSET_ADMIN_LASTNAME}" \
          --email "${SUPERSET_ADMIN_EMAIL}" || true
        superset init
    volumes:
      - ./infrastructure/superset:/app/pythonpath
      - superset_home:/app/superset_home
    networks:
      - lakehouse_net

  superset:
    build:
      context: ./infrastructure/superset
      args:
        SUPERSET_IMAGE: ${SUPERSET_IMAGE}
    image: lakehouse-superset:3.1.0
    container_name: superset
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    environment: *superset-common-env
    ports:
      - "${SUPERSET_PORT}:8088"
    volumes:
      - ./infrastructure/superset:/app/pythonpath
      - superset_home:/app/superset_home
    networks:
      - lakehouse_net
